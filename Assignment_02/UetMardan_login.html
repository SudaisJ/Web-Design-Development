<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UET Mardan - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #d0d3da;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .login-card {
      background: #ffffff;
      border-radius: 6px;
      padding: 40px 35px 35px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    .university-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #1a3a6b;
      object-fit: cover;
    }

    .logo-placeholder {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #1a3a6b;
      background: #1a3a6b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
    }

    .signin-text {
      color: #555;
      font-size: 14px;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .form-control {
      border-radius: 3px;
      border: 1px solid #ccc;
      font-size: 14px;
      padding: 10px 12px;
    }

    .form-control:focus {
      border-color: #1a3a6b;
      box-shadow: 0 0 0 0.2rem rgba(26, 58, 107, 0.15);
    }

    .input-group-text {
      background: white;
      border-left: none;
      border-radius: 0 3px 3px 0;
      color: #888;
    }

    .input-group .form-control {
      border-right: none;
    }

    .btn-signin {
      background-color: #28a745;
      border-color: #28a745;
      border-radius: 3px;
      font-size: 14px;
      padding: 8px 22px;
      color: white;
    }

    .btn-signin:hover {
      background-color: #218838;
      border-color: #218838;
      color: white;
    }

    .btn-register {
      background-color: #5b9bd5;
      border-color: #5b9bd5;
      border-radius: 3px;
      font-size: 14px;
      padding: 10px;
      color: white;
      width: 100%;
    }

    .btn-register:hover {
      background-color: #4a87c0;
      border-color: #4a87c0;
      color: white;
    }

    .forgot-link {
      color: #5b9bd5;
      font-size: 13px;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
      color: #4a87c0;
    }

    h4.page-title {
      font-weight: 700;
      color: #222;
      letter-spacing: 0.5px;
      font-size: 1.6rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-auto">

        <!-- Title above the card -->
        <h4 class="page-title text-center mb-4">UET MARDAN</h4>

        <!-- Login Card -->
        <div class="login-card">

          <!-- Logo -->
          <div class="text-center">
            <div class="logo-placeholder mx-auto">U</div>
            <p class="signin-text">Sign in to the system</p>
          </div>

          <!-- Email Field -->
          <div class="input-group mb-3">
            <input type="email" class="form-control" placeholder="User Email" />
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          </div>

          <!-- Password Field -->
          <div class="input-group mb-3">
            <input type="password" class="form-control" placeholder="Password" />
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
          </div>

          <!-- Forgot Password + Sign In -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="#" class="forgot-link">Forgot My Password</a>
            <button class="btn btn-signin">Sign In</button>
          </div>

          <!-- Register Button -->
          <button class="btn btn-register">Register</button>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
