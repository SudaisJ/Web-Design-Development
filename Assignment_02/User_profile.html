<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment_02</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: sans-serif; }
        .breadcrumb-bar { background-color: #e9ecef; padding: 10px 20px; }
        .profile-accent { border-left: 5px solid #dee2e6; padding-left: 20px; }
        .btn-submit { background-color: #31a2b8; color: white; border: none; }
        .backup-bg { 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://share.google/G51hp39nE1Gl4VBUj');
            background-size: cover;
            padding: 50px 0;
            margin-top: 40px;
        }
        .callout-green { background-color: #00a65a; color: white; border-radius: 4px; padding: 15px; }
    </style>
</head>
<body>

<div class="container-fluid p-0 mb-5">
    <div class="breadcrumb-bar d-flex justify-content-between align-items-center">
        <h5 class="mb-0 text-secondary">User Profile</h5>
        <div class="text-muted small"><i class="bi bi-house-door-fill"></i> Home > User Profile</div>
    </div>

    <div class="container mt-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-0 pt-3 ps-4">
                <h6 class="text-muted">User Profile</h6>
            </div>
            <div class="card-body p-4">
                <div class="row">
                    <div class="col-md-6 profile-accent">
                        <div class="d-flex align-items-center mb-1">
                            <i class="bi bi-person-fill text-primary fs-4 me-2"></i>
                            <h5 class="text-primary mb-0">Sudais Jamal</h5>
                        </div>
                        <p class="text-muted ms-4">User Name : sudaisjamal</p>
                    </div>

                    <div class="col-md-6 mt-4 mt-md-0">
                        <h6 class="text-primary fw-bold mb-3">Change Password</h6>
                        <form>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Enter Current Password</label>
                                <input type="password" class="form-control form-control-sm" placeholder="Enter your current password">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Enter New Password</label>
                                <input type="password" class="form-control form-control-sm" placeholder="Enter new password">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Re-Enter New Password</label>
                                <input type="password" class="form-control form-control-sm" placeholder="Re-Enter new password">
                            </div>
                            <button type="submit" class="btn btn-submit px-4">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="backup-bg">
    <div class="container text-white mb-3 d-flex justify-content-between align-items-center">
        <h4 class="fw-normal">Database Backup</h4>
        <small><i class="bi bi-house-door-fill"></i> Home > Database Backup</small>
    </div>

    <div class="container">
        <div class="card shadow border-0">
            <div class="card-header bg-white py-3">
                <h6 class="mb-0 text-muted">Create Database Backup</h6>
            </div>
            <div class="card-body p-4">
                <div class="row align-items-center">
                    <div class="col-md-7 mb-3 mb-md-0">
                        <div class="callout-green shadow-sm">
                            <h6 class="fw-bold mb-2"><i class="bi bi-database-fill"></i> Take Backup</h6>
                            <p class="small mb-0">
                                If you do not want to lose your data, it is very important to make regular backups of your data to protect it from loss.
                            </p>
                        </div>
                    </div>

                    <div class="ps-md-4 col-md-5">
                        <label class="form-label fw-bold small">Password</label>
                        <input type="password" class="form-control mb-3" placeholder="Enter your password to download the backup">
                        <button class="btn btn-success d-flex align-items-center">
                            Create Backup <i class="bi bi-database-down ms-2"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
